  class AudioQueue {
    constructor () {
      this.queue = []
      this.isPlaying = false
      this.maxRetries = 5;
    }

    // 添加音频到队列
    add (url) {
      this.queue.push(url)
      if (!this.isPlaying) {
        this.playNext()
      }
    }

    // 播放下一首
    playNext () {
      if (this.queue.length === 0) {
        this.isPlaying = false
        console.log('队列已空')
        return
      }
      this.isPlaying = true

      const url = this.queue.shift() // 取出第一个音频
      this.playWithRetry(url);
    }

    // 带重试机制的播放
    playWithRetry(url, retryCount=0) {
      // 1. 先显示系统通知
      const urlObj = new URL(url)
      const params = new URLSearchParams(urlObj.search)
      const message = params.get('tex')
      if (retryCount === 0) {
        // this.showNotification(message)
      }
      $('#myaudio').attr('src', url)
      this.currentAudio = $('#myaudio')[0];

      this.currentAudio.play()
        .then(() => {
          console.log(`播放成功: ${url}`)
          this.currentAudio.onended = () => {
            console.log(`播放结束: ${message}`)
            this.playNext() // 播放下一个
          }
        })
        .catch(error => {
          console.error(`播放失败 (${retryCount + 1}/${this.maxRetries}): ${message}`, error)

          if (retryCount < this.maxRetries) {
            setTimeout(() => {
              this.playWithRetry(url, retryCount + 1) // 重试
            }, 1000) // 1秒后重试
          } else {
            console.error(`放弃播放: ${url}`)
            this.playNext() // 跳过当前，播放下一个
          }
        })
    }


    // 显示系统通知
    showNotification (message) {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          console.log(permission)
          if (permission === 'granted') {
            new Notification(message)
          }
        })
      } else {
        console.log('无法显示通知：权限未授予或浏览器不支持')
      }
    }

    // 重播
    replay (url, times=0) {
      times++
      if (times > 5) return false
      console.log('重播' + times, url)
      $('#myaudio').attr('src', url)
      var myAuto = $('#myaudio')[0];
      let that = this;
      myAuto.play().catch(error => {
        // sleep(1000);
        that.replay(url,times)
      })
    }

  }

    $('.msgtype').click(function () {
      $(this).siblings().removeClass('btn-primary').addClass('btn-default')

      var readurl1 = 'http://img.51christ.com/read/' + audio + '.mp3'

    // 重播
    function replay (url) {
      times++
      if (times > 5) return false
      console.log('重播' + times)
      $('#myaudio').attr('src', url)
      var myAuto = $('#myaudio')[0]
      myAuto.play().catch(error => {
        setTimeout(function () {
          replay(url)
        }, 1000)
      })
    }

    let ws = null  // WebSocket 对象
    let heartbeatTimer = null  // 心跳定时器
    const isReconnect = true  // 是否自动重连

    function createWebSocket () {
      ws = new WebSocket('wss://duanxianxia.cn/wss1')

      ws.onopen = function () {
        console.log('WebSocket 已连接')
        startHeartbeat()
      }

      ws.onmessage = function (e) {
        if (!e.data.match('stocklive')) {
          return
        }
        const info = JSON.parse(e.data)
        if (!zxtype.includes(info.from) && !zxtype.includes('juhe')) {
          return false
        }
        //if ($.inArray(info.from, permit) == -1) return false;
        if (news[info.from].msgtype == 'pause') return false
        if (news[info.from].msgtype == 'import' && info.import == 0) return false

        if (info.type == 'ticaiku') {
        }
        const word = news[info.from].name
        // 播放
        if (info.from != 'tck' && info.from != 'dpzb') {
          autoPlay(word + ',' + info.msg, info.readurl)
        }
        if (info.from == 'tck' && info.type == ticai_type && info.digest.indexOf('概念') == -1) autoPlay(info.msg + ',' + info.digest + '概念', info.readurl)
        if (info.from == 'tck' && info.type == ticai_type && info.digest.indexOf('概念') != -1) autoPlay(info.msg + ',' + info.digest, info.readurl)

        if (info.from == 'dpzb') {
          autoPlay(info.msg, info.readurl)
          info.msg = ''
        }

        var url = '###'
        if (newstype == 'tdx') url = 'http://www.treeid/CODE_' + info.code
        if (info.name != '') $('#' + info.from + '_name').html('<a style=\'color:red;\' href=\'' + url + '\'>' + info.name + '</a>')
        else $('#' + info.from + '_name').html('无')

        if (info.from == 'jiuyan') {
          $('#jiuyan_msg').find('.jytitle').eq(0).children('a').css('color', '#444')
          $('#jiuyan_msg').html(info.html + $('#jiuyan_msg').html())
          $('#jiuyan_msg').find('.jytitle').eq(0).children('a').css('color', 'red')
        } else if (info.from == 'tck') {
          getTicaiNews(ticai_type)
        } else {
          if (black == 'black') var tcolor = 'white'
          else var tcolor = 'black'
          if (news[info.from].showtype == 'content') {
            if (info.msg) info.msg = '【' + info.msg + '】'
            if (newstype == 'tdx') {
              if (info.import > 0) $('#' + info.from + '_msg').html('<a  class=\'msg_color1\' style=\'text-decoration:none;\' href=\'' + url + '\'><b style=\'font-weight:bold;\'>【' + info.msg + '】</b><span style=\'font-size:13px;\'>' + info.digest + '</span></a>')
              else $('#' + info.from + '_msg').html('<a  class=\'msg_color2\' style=\'text-decoration:none;\' href=\'' + url + '\'><b style=\'font-weight:bold;\'>' + info.msg + '</b><span style=\'font-size:13px;\'>' + info.digest + '</span></a>')
            } else {
              if (info.import > 0) $('#' + info.from + '_msg').html('<span class=\'msg_color1\' style=\'text-decoration:none;\' ><b style=\'font-weight:bold;\'>' + info.msg + '</b><span style=\'font-size:13px;\'>' + info.digest + '</span></span>')
              else $('#' + info.from + '_msg').html('<span  class=\'msg_color2\' style=\'text-decoration:none;\' ><b style=\'font-weight:bold;\'>' + info.msg + '</b><span style=\'font-size:13px;\'>' + info.digest + '</span></span>')
            }
          } else {
            $('#' + info.from + '_msg').html(info.html + $('#' + info.from + '_msg').html())
          }
          // 如果显示聚合面板
          if (zxtype.includes('juhe')) {
            const htmlString = info.html
            // 将字符串转换为 jQuery 对象
            const $temp = $(htmlString)
            // 获取 <a> 标签的 href
            const href = $temp.find('.jytitle a').attr('href')
            let juheItem = `
                <li class="layui-timeline-item ">
                    <i class="layui-icon layui-timeline-axis"/>
                    <div class="layui-timeline-content layui-text">
                        <h3 class="layui-timeline-title">${info.time}</h3>
                        <h3 class="layui-timeline-title newstitle">${info.title}</h3>
                        <div class="news-container">
                            <div class="newscontent digest">${info.digest}</div>
                            <label class="expand-btn">展开</label>
                        </div>
                        <div class="newscontent">
                            <a href="${href}" class="label label-default">${news[info.from].name}</a>
                        </div>
                    </div>
                </li>
            `

            $('#juhe_msg>ul').html(juheItem + $('#juhe_msg>ul').html())
          }
        }
      }

      ws.onclose = function (e) {
        console.log('WebSocket 已关闭')
        stopHeartbeat()
        setTimeout(function () {
          console.log('WebSocket 尝试重新连接')
          createWebSocket()
        }, 5 * 1000)
      }

      ws.onerror = function (e) {
        console.log('WebSocket错误:', e)
      }

    }

    // 开始心跳定时器
    function startHeartbeat (interval) {
      interval = interval || 30
      heartbeatTimer = setInterval(function () {
        ws.send('ping')
      }, interval * 1000)
    }

    // 停止心跳定时器
    function stopHeartbeat () {
      clearInterval(heartbeatTimer)
    }

    // 启动 WebSocket 连接
    createWebSocket()

  })
