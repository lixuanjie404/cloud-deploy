<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页</title>
  <script src="https://code.jquery.com/jquery-2.0.0.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/layer/3.5.1/theme/default/layer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/layer/3.5.1/layer.min.js"></script>
  <style>
      .main-body {
          font-family: "Segoe UI", Arial, sans-serif;
          background-color: #f9f9f9;
          color: #555;
          margin: 0;
          padding: 20px;
      }

      .menu {
          list-style: none;
          padding: 0;
          max-width: 260px;
      }

      .menu li {
          background: #fff;
          margin-bottom: 8px;
          border-radius: 6px;
          box-shadow: 0 0 0 rgba(0, 0, 0, 0);
          transition: all 0.2s ease;
          padding: 8px 12px;
          font-size: 14px;
      }

      .menu li:hover {
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
          background: #f3f3f3;
      }

      .menu a {
          text-decoration: none;
          color: #555;
          display: flex;
          align-items: center;
      }

      .icon {
          font-size: 14px;
          color: #aaa;
          margin-right: 6px;
      }

      .divider {
          color: #ccc;
          text-align: center;
          font-size: 12px;
          padding: 4px 0;
      }

      #amount {
          border: none;
          float: right;
          margin-top: 234px;
          width: 60%;
          height: 280px;
          background: #fff;
          border-radius: 6px;
      }
  </style>
</head>
<body class="main-body">

<ol class="menu">
  <li><a href="#/news.html" id="news"><span class="icon">📰</span>资讯</a></li>
  <li><a href="/qxlive.html" target="_blank"><span class="icon"></span>市场情绪</a></li>
  <li class="divider">──────start</li>
  <li><a href="https://duanxianxia.cn/web/jjlive" target="_blank"><span class="icon">⏳</span>隔夜单统计</a></li>
  <li class="divider">──────go</li>
  <li><a href="#/yidong.html" id="yidong"><span class="icon">📢</span>异动播报</a></li>
  <li><a href="#/ztlive.html" id="ztlive">实时涨停播报</a></li>
  <li>
    <a href="https://wenda.tdx.com.cn/site/wenda/stock_index.html?message=去除st,去除北交所,成交额前100,量比,实际换手率"
       target="_blank">
      <span class="icon">🍜</span>问小达
    </a>
  </li>
  <li><a href="https://wenda.tdx.com.cn/site/wenda/page-user-center.html">问小达问句</a></li>
  <li><a href="#https://duanxianxia.cn/web/fupangu/" id="lianban"><span class="icon">📂</span>复盘古</a></li>
  <li class="divider">──────end</li>
  <li><a href="#https://duanxianxia.cn/web/fupan" id="fupan"><span class="icon">📅</span>涨停复盘</a></li>
  <li><a href="https://data.10jqka.com.cn/financial/yjyg/" target="_blank"><span class="icon">📑</span>业绩报</a></li>
</ol>

<iframe src="https://www.duanxianxia.cn/web/amount" id="amount" name="amount"></iframe>

<script>
  $('#news').click(function () {
    layer.open({
      id: 'newsT',
      type: 2,
      title: '资讯',
      maxmin: true,
      area: ['666px', '88%'],
      offset: 'b',
      shade: 0,
      fixed: false,
      content: '/news.html'
    })
  })

  $('#yidong').click(function () {
    layer.open({
      id: 'yidong_',
      type: 2,
      title: '异动播报',
      maxmin: false,
      area: ['660px', '600px'],
      offset: 'lb',
      shade: 0,
      fixed: false,
      content: '/yidong.html'
    })
  })

  $('#ztlive').click(function () {
    // 目标：让弹窗高度与内嵌页面高度一致
    var iframeEl
    var index = layer.open({
      id: 'ztliveT',
      type: 2,
      title: '实时涨停播报',
      maxmin: true,
      area: ['660px', '700px'], // 初始尺寸
      offset: 'rb',
      shade: 0,
      fixed: false,
      content: ['/ztlive.html', 'no'],
      success: function (layero, idx) {
        // layero 是弹窗 DOM，查找其中的 iframe
        iframeEl = layero.find('iframe')[0]
        // 如果 layer.iframeAuto 可用，尝试让 iframe 自适应高度
        try {
          layer.iframeAuto(idx)
        } catch (e) {
          // ignore
        }
        // 当 iframe 内容加载完成时再触发一次自适应
        if (iframeEl) {
          $(iframeEl).on('load.ztlive', function () {
            try { layer.iframeAuto(idx) } catch (e) {}
          })
        }
      },
      end: function () {
        // 关闭时清理事件
        $(window).off('resize.ztlive_' + index)
        if (iframeEl) { $(iframeEl).off('load.ztlive') }
      }
    })
  })

  $('#lianban').click(function () {
    layer.open({
      id: 'lianban_',
      type: 2,
      area: ['60%', '100%'],
      title: '昨日涨停',
      maxmin: true,
      offset: 'auto',
      shade: 0,
      fixed: false,
      content: 'https://duanxianxia.cn/web/fupangu'
    })
  })

  $('#fupan').click(function () {
    layer.open({
      id: 'fupan_',
      type: 2,
      area: ['100%', '100%'],
      title: '涨停复盘',
      maxmin: true,
      offset: 'lb',
      shade: 0,
      fixed: false,
      content: 'https://duanxianxia.cn/web/fupan',
      success: function(layero, index){
        layer.full(index); // 最大化
      }
    })
  })

  // 窗口尺寸变化时重新自适应
  // $(window).on('resize.ztlive_' + index, function () {
  //   try { layer.iframeAuto(index) } catch (e) {}
  // })
</script>

</body>
</html>
