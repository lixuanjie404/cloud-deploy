<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>摸鱼专用</title>
  <style>
    body.moyu-body {
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #333;
    }

    header.moyu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e5e5;
    }

    .moyu-title {
      font-size: 16px;
      font-weight: 500;
      color: #555;
    }

    .moyu-actions {
      display: flex;
      gap: 8px;
    }

    .moyu-btn {
      background-color: #f0f0f0;
      border: 1px solid #dcdcdc;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .moyu-btn:hover {
      background-color: #e8e8e8;
    }

    main.moyu-main {
      width: 100%;
      height: calc(100vh - 42px);
    }

    iframe.moyu-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #fff;
    }
  </style>
</head>
<body class="moyu-body">
  <header class="moyu-header">
    <div class="moyu-title">工作监控面板</div>
    <div class="moyu-actions">
      <button class="moyu-btn" onclick="location.reload()">刷新</button>
      <button class="moyu-btn" onclick="toggleFullScreen()">全屏</button>
    </div>
  </header>
  <main class="moyu-main">
    <iframe class="moyu-iframe" src="https://example.com"></iframe>
  </main>

  <script>
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
