<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>辨识度候选池</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #5c6660; font-size: 12px; }
  body.dark { color: #9aa3a0; }
  #wrap { height: 100%; box-sizing: border-box; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
  #meta { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  #meta b { font-weight: 600; color: #d2453a; font-variant-numeric: tabular-nums; }
  body.dark #meta b { color: #ff7a63; }
  #note { font-size: 11px; color: #9aa3a0; }
  #toolbar { display: flex; align-items: center; gap: 8px; }
  #toolbar button { font-family: inherit; font-size: 11px; padding: 3px 10px; border: 1px solid #d2453a; border-radius: 4px; background: transparent; color: #d2453a; cursor: pointer; }
  body.dark #toolbar button { color: #ff9a86; border-color: #ff9a86; }
  #toolbar button:disabled { opacity: .5; cursor: default; }
  #chart { height: 140px; flex: 0 0 auto; }
  #tableWrap { flex: 1; min-height: 0; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 6px; text-align: right; border-bottom: 1px solid #e6e9e4; white-space: nowrap; }
  body.dark th, body.dark td { border-color: #343a36; }
  th { position: sticky; top: 0; background: #fafbf9; font-weight: 600; cursor: pointer; }
  body.dark th { background: #232825; }
  .l { text-align: left; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 9px; font-size: 10px; margin-right: 3px; }
  .tag.src { background: #eef1ed; color: #6c766f; }
  body.dark .tag.src { background: #2b312d; color: #8b958f; }
  .tag.zt { background: rgba(210,69,58,.12); color: #d2453a; }
  body.dark .tag.zt { background: rgba(255,122,99,.16); color: #ff9a86; }
  .tag.label { background: rgba(210,69,58,.12); color: #d2453a; }
  body.dark .tag.label { background: rgba(255,122,99,.16); color: #ff9a86; }
  .tag.label.plain { background: #eef1ed; color: #8a948e; }
  body.dark .tag.label.plain { background: #2b312d; color: #7f8984; }
  .tag.theme { cursor: pointer; }
  .tag.theme.on { background: rgba(210,69,58,.12); color: #d2453a; }
  body.dark .tag.theme.on { background: rgba(255,122,99,.16); color: #ff9a86; }
  #themeFilterBox { font-size: 11px; }
  #themeFilterBox a { color: inherit; }
  #err { font-size: 12px; color: #d2453a; display: none; }
  body.dark #err { color: #ff9a86; }
  .pos { color: #d2453a; }
  .neg { color: #1a9d6a; }
  .stock-link { color: inherit; text-decoration: none; cursor: pointer; }
  .stock-link:hover { color: #d2453a; text-decoration: underline; }
  body.dark .stock-link:hover { color: #ff9a86; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="meta">
      <span>日期 <b id="asOf">--</b></span>
      <span>扫描 <b id="scan">--</b></span>
      <span>热榜更新 <b id="hotTime">--</b></span>
      <span>候选 <b id="cnt">--</b></span>
      <span>口径 <b id="spec">--</b></span>
      <span id="note">全市场扫描；热榜每小时四源；涨幅/成交榜补非涨停强势标的；题材取异动解析（回退涨停解析），点击可多选筛选</span>
      <span id="toolbar"><button type="button" id="refreshBtn">刷新</button><span id="themeFilterBox"></span></span>
    </div>
    <div id="chart"></div>
    <div id="tableWrap">
      <table>
        <thead>
          <tr>
            <th class="l" data-k="code">代码</th>
            <th class="l" data-k="name">名称</th>
            <th class="l" data-k="tags">来源</th>
            <th class="l" data-k="themeText">近期炒作题材</th>
            <th data-k="lianban">连板</th>
            <th data-k="changePct">涨幅</th>
            <th class="l" data-k="firstSeal">首封</th>
            <th data-k="breakout60">破前高</th>
            <th data-k="ret20">20日收益</th>
            <th data-k="independence">独立性</th>
            <th class="l" data-k="label">标注</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="err"></div>
  </div>

<script>
(function () {
  var dark = new URLSearchParams(location.search).get('theme') === 'dark'
  if (dark) document.body.classList.add('dark')

  var LIMIT = 15
  var chart = null
  var rows = []
  var sortKey = 'independence'
  var sortDir = -1
  var themeFilter = []

  function showError(msg) {
    var box = document.getElementById('err')
    box.textContent = msg
    box.style.display = 'block'
  }
  function fmt(v, digits) { return v == null || !isFinite(v) ? '--' : Number(v).toFixed(digits == null ? 3 : digits) }
  function pct(v) { return v == null || !isFinite(v) ? '--' : (Number(v) * 100).toFixed(2) + '%' }
  function cls(v) { return v == null || !isFinite(v) ? '' : (v > 0 ? 'pos' : v < 0 ? 'neg' : '') }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }
  // 个股代码/名称做成链接：提取 6 位代码，点击交给父页面的分时走势弹窗
  function stockLink(code, text) {
    var m = String(code || '').match(/\d{6}/)
    var label = esc(text == null ? code : text)
    if (!m) return label
    return '<a href="javascript:void(0)" class="stock-link" data-code="' + m[0] + '">' + label + '</a>'
  }
  function openStockTrend(code) {
    try {
      if (window.parent && window.parent !== window && typeof window.parent.openTrendDialog === 'function') {
        window.parent.openTrendDialog('intraday', code)
        return
      }
    } catch (err) { /* 跨域时不处理 */ }
    showError('请从工作台打开候选池后，再点击个股查看分时走势')
  }
  function seal(s) {
    if (!s) return '--'
    var t = String(s).padStart(6, '0')
    return t.slice(0, 2) + ':' + t.slice(2, 4) + ':' + t.slice(4, 6)
  }

  function renderTable() {
    var visible = rows.filter(function (r) {
      if (!themeFilter.length) return true
      return (r.themes || []).some(function (t) { return themeFilter.indexOf(t) >= 0 })
    })
    var sorted = visible.slice().sort(function (a, b) {
      var x = a[sortKey], y = b[sortKey]
      if (x == null && y == null) return 0
      if (x == null) return 1
      if (y == null) return -1
      if (typeof x === 'string') return sortDir * x.localeCompare(y)
      return sortDir * (x - y)
    })
    var html = ''
    sorted.forEach(function (r) {
      var tags = (r.tags || []).map(function (t) {
        if (t === '热门' && r.hotSources && r.hotSources.length) {
          var tip = r.hotSources.map(function (s) { return s.label + '第' + s.rank }).join(' / ')
          return '<span class="tag src" title="' + esc(tip) + '">热门×' + r.hotSources.length + '</span>'
        }
        return '<span class="tag src' + (t === '涨停' ? ' zt' : '') + '">' + esc(t) + '</span>'
      }).join('')
      var labelCls = r.label === '独立走势' || r.label === '身位核心' ? 'label' : 'label plain'
      var bo = r.breakout60 == null ? '--' : (r.breakout60 ? '是' : '否')
      var themeCell = (r.themes && r.themes.length)
        ? r.themes.map(function (t) {
            var on = themeFilter.indexOf(t) >= 0 ? ' on' : ''
            return '<span class="tag src theme' + on + '" data-t="' + esc(t) + '">' + esc(t) + '</span>'
          }).join('')
        : esc(r.industry || '--')
      html += '<tr>' +
        '<td class="l">' + stockLink(r.code, r.code) + '</td>' +
        '<td class="l">' + stockLink(r.code, r.name || '--') + '</td>' +
        '<td class="l">' + tags + '</td>' +
        '<td class="l">' + themeCell + '</td>' +
        '<td>' + (r.lianban || 0) + '</td>' +
        '<td class="' + cls(r.changePct) + '">' + (r.changePct == null ? '--' : fmt(r.changePct, 2) + '%') + '</td>' +
        '<td class="l">' + seal(r.firstSeal) + '</td>' +
        '<td>' + bo + '</td>' +
        '<td class="' + cls(r.ret20) + '">' + pct(r.ret20) + '</td>' +
        '<td class="' + cls(r.independence) + '">' + fmt(r.independence) + '</td>' +
        '<td class="l"><span class="tag ' + labelCls + '">' + esc(r.label || '普通') + '</span></td>' +
        '</tr>'
    })
    document.getElementById('tbody').innerHTML = html
    renderThemeFilter()
  }

  function renderThemeFilter() {
    var box = document.getElementById('themeFilterBox')
    if (!themeFilter.length) { box.innerHTML = ''; return }
    box.innerHTML = '筛选：' + themeFilter.map(function (t) {
      return '<span class="tag src theme on" data-t="' + esc(t) + '">' + esc(t) + ' ×</span>'
    }).join('') + '<a href="javascript:void(0)" id="clearThemeFilter">清除</a>'
  }

  function toggleTheme(t) {
    var i = themeFilter.indexOf(t)
    if (i >= 0) themeFilter.splice(i, 1)
    else themeFilter.push(t)
    renderTable()
  }

  function renderChart() {
    var ok = rows.filter(function (r) { return r.independence != null }).slice(0, 24)
    if (!ok.length) return
    var textColor = dark ? '#9aa3a0' : '#7b857f'
    var axisColor = dark ? '#343a36' : '#e6e9e4'
    chart = chart || echarts.init(document.getElementById('chart'))
    chart.setOption({
      animation: false, backgroundColor: 'transparent',
      grid: { left: 6, right: 16, top: 8, bottom: 4, containLabel: true },
      tooltip: { trigger: 'axis', confine: true },
      xAxis: { type: 'category', data: ok.map(function (r) { return r.name || r.code }), axisLine: { lineStyle: { color: axisColor } }, axisTick: { show: false }, axisLabel: { color: textColor, fontSize: 9, rotate: 35 } },
      yAxis: { type: 'value', axisLine: { show: false }, axisTick: { show: false }, splitLine: { lineStyle: { color: axisColor } }, axisLabel: { color: textColor, fontSize: 10 } },
      series: [{ type: 'bar', data: ok.map(function (r) { return { value: Number(r.independence.toFixed(3)), itemStyle: { color: (r.label === '独立走势' || r.label === '身位核心') ? '#d2453a' : '#8fb3a2' } } }), barMaxWidth: 22 }]
    }, true)
    chart.resize()
  }

  function bindSort() {
    document.querySelectorAll('th[data-k]').forEach(function (th) {
      th.addEventListener('click', function () {
        var k = th.getAttribute('data-k')
        if (sortKey === k) sortDir = -sortDir
        else { sortKey = k; sortDir = -1 }
        renderTable()
      })
    })
  }

  function render(data) {
    rows = data.rows || []
    rows.forEach(function (r) {
      r.themeText = (r.themes && r.themes.length) ? r.themes.join('+') : (r.industry || '')
    })
    themeFilter = themeFilter.filter(function (t) {
      return rows.some(function (r) { return (r.themes || []).indexOf(t) >= 0 })
    })
    document.getElementById('asOf').textContent = data.asOf || data.date || '--'
    var s = data.scanned || {}
    document.getElementById('scan').textContent = '涨停' + (s.zt || 0) + '/炸板' + (s.zb || 0) + '/热门' + (s.hot || 0) + '/强势' + (s.strong || 0)
    document.getElementById('hotTime').textContent = data.hotAsOf ? String(data.hotAsOf).slice(5, 16) : (s.hotFallback ? '现拉' : '--')
    document.getElementById('cnt').textContent = data.count || rows.length
    document.getElementById('spec').textContent = 'v' + (data.specVersion || '--')
    renderTable(); renderChart()
    document.getElementById('err').style.display = 'none'
  }

  function load() {
    var btn = document.getElementById('refreshBtn')
    btn.disabled = true
    fetch('/api/feat/candidates?limit=' + LIMIT, { cache: 'no-store' })
      .then(function (r) { return r.json() })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error || '接口返回异常')
        render(res)
      })
      .catch(function (err) { showError('数据加载失败：' + err.message) })
      .finally(function () { btn.disabled = false })
  }

  function start() {
    bindSort()
    document.getElementById('refreshBtn').addEventListener('click', load)
    document.addEventListener('click', function (e) {
      var link = e.target.closest ? e.target.closest('.stock-link') : null
      if (link) { e.preventDefault(); openStockTrend(link.getAttribute('data-code')); return }
      if (e.target.id === 'clearThemeFilter') { themeFilter = []; renderTable(); return }
      var tag = e.target.closest ? e.target.closest('.tag.theme') : null
      if (tag) toggleTheme(tag.getAttribute('data-t'))
    })
    load()
    window.addEventListener('resize', function () { if (chart) chart.resize() })
  }

  if (window.echarts) {
    start()
  } else {
    var s = document.createElement('script')
    s.src = 'https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js'
    s.onload = start
    s.onerror = function () {
      var t = document.createElement('script')
      t.src = 'https://duanxianxia.cn/static/js/echarts.min.js'
      t.onload = start
      t.onerror = function () { start() }
      document.head.appendChild(t)
    }
    document.head.appendChild(s)
  }
})()
</script>
</body>
</html>
